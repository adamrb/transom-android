plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.plaudbridge.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.plaudbridge.app"
        minSdk 21
        targetSdk 34
        // In-app updates compare the server-hosted APK's version_code against this value:
        // EVERY release uploaded to the server must increment versionCode.
        versionCode 11
        versionName "0.4.3"
        // No build-time secrets: the Plaud user access token is fetched at runtime from your
        // self-hosted plaud-bridge-server. local.properties only needs sdk.dir.
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            // Signed with the debug keystore for sideloading convenience; supply a real
            // keystore via signingConfigs for store-facing builds.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    testOptions {
        unitTests {
            // Robolectric: real android.util/org.json/SharedPreferences implementations on the JVM
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Audio playback: robust Ogg/Opus support (OEM MediaPlayer often fails on it)
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    // Plaud SDK
    implementation files('libs/plaud-sdk.aar')

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    // Durable upload queue: retries pending server uploads even after the process is killed
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    // Library tab: pull-to-refresh around the dashboard WebView
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // QR onboarding scanner. transitive=false + explicit zxing core 3.3.0: the wrapper's default
    // core (3.4.x) requires API 24+, this app supports minSdk 21 (journeyapps README recipe).
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
    implementation 'com.google.zxing:core:3.3.0'

    // Material
    implementation 'com.google.android.material:material:1.10.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'
    // Markdown rendering for AI summaries (headings, bold, lists, tables, links)
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'

    // Networking (self-hosted bridge server API)
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

    // SDK transitive dependencies (the AAR declares these via api; the app must add them)
    implementation 'com.jakewharton.timber:timber:4.7.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'org.slf4j:slf4j-api:1.7.32'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.java-websocket:Java-WebSocket:1.5.1'
    implementation 'com.google.guava:guava:28.2-android'

    // Unit tests (JVM): Robolectric for the Android runtime, MockWebServer for HTTP contracts
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    // Robolectric+OkHttp platform detection tries to load Conscrypt's native
    // lib on the JVM; the uber jar bundles it (fixes UnsatisfiedLinkError).
    testImplementation 'org.conscrypt:conscrypt-openjdk-uber:2.5.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.3'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.work:work-testing:2.9.1'
}
